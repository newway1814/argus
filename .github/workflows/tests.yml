name: Argus tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare ffmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          (command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null) ||
            (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Prepare ffmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          (command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null) ||
            brew install ffmpeg
      - name: Prepare ffmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (
            -not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or
            -not (Get-Command ffprobe -ErrorAction SilentlyContinue)
          ) {
            choco install ffmpeg --no-progress -y
          }
      - name: Require both media tools
        run: |
          python -c "import shutil, sys; missing = [tool for tool in ('ffmpeg', 'ffprobe') if not shutil.which(tool)]; print('missing media tools:', ', '.join(missing)) if missing else print('ffmpeg and ffprobe ready'); sys.exit(bool(missing))"
      - name: Run offline test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
